# Vhost del nginx del HOST (droplet) para el frontend. Copiar a
# /etc/nginx/sites-available/condotrack.frubilarz.cl y enlazar en sites-enabled.
# TLS: `certbot --nginx -d condotrack.frubilarz.cl` agrega el bloque 443 y la
# redireccion 80 -> 443 automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name condotrack.frubilarz.cl;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
