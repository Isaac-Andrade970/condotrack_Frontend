# nginx dentro del contenedor condotrack-frontend. El nginx del host (proxy inverso
# con TLS para condotrack.frubilarz.cl) reenvía a 127.0.0.1:4200 -> este server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Usado por el HEALTHCHECK de Docker y el stage Health Check de Jenkins.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash en el nombre (Vite): cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de React Router cae en index.html (sin cache).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
